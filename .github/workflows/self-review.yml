# Dogfooding: this action reviews its own PRs.
name: self-review
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write  # SARIF upload

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-key: ${{ secrets.OPENROUTER_KEY }}
          fail-on: high
          sarif-path: results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
      - run: echo "findings=${{ steps.review.outputs.findings }} worst=${{ steps.review.outputs.max-severity }}"
